name: Deploy dev loop

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/dev-loop/**"
      - ".github/workflows/deploy-dev-loop.yml"

permissions:
  contents: read

concurrency:
  group: dev-loop-deploy

jobs:
  deploy:
    runs-on: [self-hosted, omarchy]
    steps:
      - uses: actions/checkout@v7
      - name: Install dev loop
        run: bash tools/dev-loop/install.sh
      - name: Restart enabled dashboard
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          if systemctl --user is-enabled --quiet victron-loop-web.service; then
            systemctl --user restart victron-loop-web.service
          fi
      - name: Dry-run once
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/victron-loop-state
        run: |
          cp ~/victron-loop/config.toml ~/victron-loop/config.ci-dryrun.toml
          python - <<'PY'
          from pathlib import Path
          cfg = Path.home() / "victron-loop" / "config.ci-dryrun.toml"
          text = cfg.read_text(encoding="utf-8")
          if "dry_run" in text:
              text = text.replace("dry_run = false", "dry_run = true")
          else:
              text += "\ndry_run = true\n"
          cfg.write_text(text, encoding="utf-8")
          PY
          cd ~/victron-loop && ./venv/bin/python -m victron_loop.main --config config.ci-dryrun.toml run-once --dry-run > "$GITHUB_WORKSPACE/dev-loop-dry-run.log"
      - name: Upload dry-run log
        uses: actions/upload-artifact@v7
        with:
          name: dev-loop-dry-run-log
          path: dev-loop-dry-run.log
          retention-days: 14

