name: Check

# flows.json in sync with the numbered sources, valid wiring, no Tuya keys; unit tests.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/flows.js check
      - run: node --test "tests/*.test.js"
