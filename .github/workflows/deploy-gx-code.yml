name: Deploy GX code

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry run changes nothing on the GX; apply deploys the selected master commit."
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: "For apply, type deploy-gx-code"
        type: string
        default: ""
      version:
        description: "Report label only; does not create a Git tag or change GX behavior."
        type: choice
        options: [test, stable]
        default: test
      allow_live_only_lines:
        description: "Pass -AllowLiveOnlyLines: only when the commit is meant to remove the GX-only code lines (check compare-before.txt first)."
        type: boolean
        default: false
      allow_new_nodes:
        description: "Pass -AllowNewNodes for reviewed additions. Review a dry run of the same commit before apply."
        type: boolean
        default: false
  # Every green Test GX run on a push to master deploys that commit: apply, no manual approval.
  workflow_run:
    workflows: ["Test GX scenarios"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-gx-code
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # workflow_run checks out the default branch, so the gate script is trusted code, not the tested commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: tools/gx/deploy-gate.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Decide whether to deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "workflow_run" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export MASTER_SHA="$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha || true)"
          node tools/gx/deploy-gate.js

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_run' && 'victron-gx-auto' || 'victron-gx' }}
    env:
      AUTO: ${{ github.event_name == 'workflow_run' }}
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      MODE: ${{ github.event_name == 'workflow_run' && 'apply' || inputs.mode }}
      VERSION_TYPE: ${{ github.event_name == 'workflow_run' && 'test' || inputs.version }}
      ALLOW_LIVE_ONLY_LINES: ${{ github.event_name == 'workflow_run' && 'false' || inputs.allow_live_only_lines }}
      ALLOW_NEW_NODES: ${{ github.event_name == 'workflow_run' && 'false' || inputs.allow_new_nodes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require master and validate deployment inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          GX_SSH_HOST: ${{ secrets.GX_SSH_HOST }}
          GX_SSH_KEY: ${{ secrets.GX_SSH_KEY }}
          GX_SSH_KNOWN_HOSTS: ${{ secrets.GX_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$AUTO" == "true" ]]; then
            # the gate job verified a green Test GX push run of exactly this master tip
            git fetch --no-tags origin master
            [[ "$(git rev-parse origin/master)" == "$DEPLOY_SHA" ]] || {
              echo "::error::master moved past $DEPLOY_SHA; a newer run deploys it."
              exit 1
            }
          else
            [[ "$GITHUB_REF" == "refs/heads/master" ]] || {
              echo "::error::Deploy GX code must be run from master."
              exit 1
            }
            if [[ "$MODE" == "apply" && "$CONFIRM" != "deploy-gx-code" ]]; then
              echo "::error::Type deploy-gx-code in 'confirm' to apply changes to the GX."
              exit 1
            fi
          fi
          for name in GX_SSH_HOST GX_SSH_KEY GX_SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            [[ -n "${!name}" ]] || {
              echo "::error::Missing required repository/environment secret: $name."
              exit 1
            }
          done
          [[ "$GX_SSH_HOST" =~ ^root@[A-Za-z0-9._-]+$ ]] || {
            echo "::error::GX_SSH_HOST must look like root@<gx-tailscale-host>."
            exit 1
          }

      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          GX_SSH_KEY: ${{ secrets.GX_SSH_KEY }}
          GX_SSH_KNOWN_HOSTS: ${{ secrets.GX_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GX_SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$GX_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Deploy from master
        id: deploy
        env:
          GX_SSH_HOST: ${{ secrets.GX_SSH_HOST }}
          TMPDIR: ${{ runner.temp }}
        shell: pwsh
        run: |
          $runFolder = Join-Path $env:RUNNER_TEMP "gx-deploy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "run_folder=$runFolder" >> $env:GITHUB_OUTPUT
          $arguments = @(
            '-NoProfile', '-File', './scripts/gx-deploy.ps1',
            '-GxHost', $env:GX_SSH_HOST,
            '-SshKey', "$HOME/.ssh/key",
            '-WaitWindowMin', '30',
            '-Commit', $env:DEPLOY_SHA,
            '-RunDirectory', $runFolder
          )
          if ($env:MODE -eq 'apply') { $arguments += '-Apply' }
          if ($env:AUTO -eq 'true') { $arguments += '-AllowReplaceDeployedLines' }
          elseif ($env:ALLOW_LIVE_ONLY_LINES -eq 'true') { $arguments += '-AllowLiveOnlyLines' }
          if ($env:ALLOW_NEW_NODES -eq 'true') { $arguments += '-AllowNewNodes' }
          & pwsh @arguments
          exit $LASTEXITCODE

      # Mail failures are warnings only; dry runs and failed applies send nothing.
      - name: Send deploy mail
        if: steps.deploy.outcome == 'success' && env.MODE == 'apply'
        continue-on-error: true
        env:
          GX_SSH_HOST: ${{ secrets.GX_SSH_HOST }}
          RUN_FOLDER: ${{ steps.deploy.outputs.run_folder }}
          TRIGGER_EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          note() {
            echo "::warning::deploy mail: failed ($1)"
            echo "deploy mail: failed ($1)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          mail="$RUNNER_TEMP/deploy-mail.json"
          node ./tools/gx/deploy-mail.js "$RUN_FOLDER" > "$mail" || note "could not build the mail"
          result="$(ssh -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$GX_SSH_HOST" 'node /data/home/nodered/tools/send-mail.js' < "$mail" 2>&1)" || note "ssh failed"
          error="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s.trim().split("\n").pop());console.log(r.ok?"":String(r.error||"unknown").replace(/[\r\n]+/g," ").slice(0,200))}catch{console.log("unreadable send-mail output")}})')"
          if [[ -n "$error" ]]; then note "$error"; fi
          echo "deploy mail: sent"
          echo "deploy mail: sent" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare public deployment summary
        if: always() && steps.deploy.outputs.run_folder != ''
        env:
          RUN_FOLDER: ${{ steps.deploy.outputs.run_folder }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'gx-deploy-public-summary.json'
          $summary = & node ./tools/gx/deploy-report.js $env:RUN_FOLDER $report
          if ($LASTEXITCODE) { throw 'Could not prepare the public deployment summary.' }
          Write-Output $summary
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Upload deploy reports
        if: always() && steps.deploy.outputs.run_folder != ''
        uses: actions/upload-artifact@v7
        with:
          name: gx-deploy-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/gx-deploy-public-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove SSH key material
        if: always()
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
