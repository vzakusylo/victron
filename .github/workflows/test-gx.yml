name: Test GX scenarios

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions: {}

# `scenarios` is a required check, so the workflow has no paths filter: every PR gets the check.
# Only PR runs cancel an in-progress run in their concurrency group.
concurrency:
  group: test-gx-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_GX_SIM: emu
  TEST_GX_TAG: synthetic-ci
  TEST_GX_COMPOSE_PROJECT: test-gx
  TEST_GX_COMPOSE_OVERRIDE: ${{ github.workspace }}/tools/test-gx/docker-compose.fixture.yml

jobs:
  build:
    name: Build shared Test GX images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      image-artifact: ${{ steps.bundle.outputs.name }}
    env:
      UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
      VENUS_DOCKER_REV: 7bd3b4fb3de24218d992d5039ee2d5a515d958b7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          relevant=true
          # A successful master push can authorize deployment, even after an earlier failed run.
          if [[ "$EVENT" == "pull_request" && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" HEAD -- \
              flows.json ':(glob)*.js' ':(glob)lib/**' ':(glob)tools/**' ':(glob)scripts/gx-*.ps1' .github/workflows/test-gx.yml)"
            if [[ -z "$changed" ]]; then
              relevant=false
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "No Test GX relevant paths changed; skipping the scenarios." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
      - name: Generate synthetic fixture
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [[ -v TEST_GX_BACKUP ]]; then
            echo "::error::TEST_GX_BACKUP must be unset in CI."
            exit 1
          fi
          node tools/test-gx/build-fixture.js
          node tools/test-gx/fixture/check.js
          node --test tools/test-gx/fixture/compose-config.test.js tools/test-gx/fixture/source-selection.test.js
          node <<'NODE'
          const fs = require('node:fs');
          const { nodeRed } = require('./tools/test-gx/fixture-versions.json');
          if (!/^\d+\.\d+\.\d+$/.test(nodeRed)) throw new Error('Invalid synthetic Node-RED version');
          fs.appendFileSync(process.env.GITHUB_ENV, `TEST_GX_NODERED_VERSION=${nodeRed}\n`);
          NODE
      # Only Venus is independent of the tested commit. Never cache the fixture image across runs.
      - name: Restore Venus simulator cache
        if: steps.changes.outputs.relevant == 'true'
        id: venus-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/test-gx-venus.tar.zst
          key: test-gx-venus-${{ runner.os }}-${{ runner.arch }}-${{ env.VENUS_DOCKER_REV }}-${{ hashFiles('.github/workflows/test-gx.yml') }}
      - name: Prepare pinned Venus simulator source
        if: steps.changes.outputs.relevant == 'true' && steps.venus-cache.outputs.cache-hit != 'true'
        run: |
          git clone -c core.autocrlf=false --depth 1 \
            https://github.com/victronenergy/venus-docker "$RUNNER_TEMP/venus-docker"
          git -C "$RUNNER_TEMP/venus-docker" fetch --depth 1 origin "$VENUS_DOCKER_REV"
          git -C "$RUNNER_TEMP/venus-docker" checkout --detach "$VENUS_DOCKER_REV"
          if [[ "$(git -C "$RUNNER_TEMP/venus-docker" rev-parse HEAD)" != "$VENUS_DOCKER_REV" ]]; then
            echo "::error::Venus source revision does not match the pinned commit."
            exit 1
          fi
          git -C "$RUNNER_TEMP/venus-docker" -c core.autocrlf=false \
            submodule update --init --recursive --depth 1
          python3 <<'PY'
          import os
          import pathlib
          import re

          dockerfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'venus-docker/dockerfile'
          source = dockerfile.read_text()
          source, html_count = re.subn(r'(?s)# Compile html5 app.*?RUN npm run build\s*', '', source, count=1)
          html_copy = 'COPY --from=html5-app ./dist/ /var/www/venus_app/'
          if html_count != 1 or source.count(html_copy) != 1:
              raise SystemExit('Pinned Venus Dockerfile HTML5 pattern not found')
          source = source.replace(html_copy, 'RUN mkdir -p /var/www/venus_app', 1)

          mirror_setup = r'''ARG UBUNTU_MIRROR
          RUN if [ -n "$UBUNTU_MIRROR" ]; then \
                sources=/etc/apt/sources.list.d/ubuntu.sources; \
                grep -Fq 'http://archive.ubuntu.com/ubuntu' "$sources" || { echo "Ubuntu archive source pattern missing" >&2; exit 1; }; \
                grep -Fq 'http://security.ubuntu.com/ubuntu' "$sources" || { echo "Ubuntu security source pattern missing" >&2; exit 1; }; \
                sed -i -e "s|http://archive.ubuntu.com/ubuntu|${UBUNTU_MIRROR%/}|g" \
                  -e "s|http://security.ubuntu.com/ubuntu|${UBUNTU_MIRROR%/}|g" "$sources"; \
              fi'''
          source, stage_count = re.subn(
              r'(?m)^FROM ubuntu:24\.04(?: AS [^\n]+)?$',
              lambda match: match.group(0) + '\n' + mirror_setup,
              source,
          )
          source, apt_count = re.subn(
              r'\bapt-get (update|install)\b',
              r'apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \1',
              source,
          )
          if stage_count != 4 or apt_count < 4:
              raise SystemExit('Pinned Venus Dockerfile Ubuntu stages or apt patterns not found')
          dockerfile.write_text(source)
          PY
      - name: Build Venus simulator image
        if: steps.changes.outputs.relevant == 'true' && steps.venus-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if ! docker build --build-arg "UBUNTU_MIRROR=$UBUNTU_MIRROR" \
              -t mqtt "$RUNNER_TEMP/venus-docker"; then
            echo "::warning::Venus image build failed; retrying once."
            docker build --build-arg "UBUNTU_MIRROR=$UBUNTU_MIRROR" \
              -t mqtt "$RUNNER_TEMP/venus-docker"
          fi
          docker save mqtt:latest | zstd -T2 -1 -o "$RUNNER_TEMP/test-gx-venus.tar.zst"
      - name: Load cached Venus simulator image
        if: steps.changes.outputs.relevant == 'true' && steps.venus-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/test-gx-venus.tar.zst"
      - name: Build synthetic Node-RED image
        if: steps.changes.outputs.relevant == 'true'
        run: docker compose -p test-gx -f tools/test-gx/docker-compose.yml -f "$TEST_GX_COMPOSE_OVERRIDE" build nodered
      - name: Verify the whole-flow deploy against Node-RED
        if: steps.changes.outputs.relevant == 'true'
        run: node tools/test-gx/check-deploy-whole-flow.js
      - name: Bundle shared Test GX images
        id: bundle
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          docker save mqtt:latest "test-gx-nodered:$TEST_GX_TAG" | zstd -T2 -1 -o "$RUNNER_TEMP/test-gx-images.tar.zst"
          # A full rerun publishes a new artifact; failed shards reuse their producer's artifact.
          echo "name=test-gx-images-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload shared Test GX images
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ runner.temp }}/test-gx-images.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # Keep the matrix jobs present even on docs-only PRs.
  run:
    name: scenarios (${{ matrix.files }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        files: [bms-watchdog.yml, charging.yml, charging-force.yml, charging-forecast.yml, charging-support.yml, charging-guards.yml, grid-edges.yml, grid-feedback.yml, grid-heartbeat.yml, grid-isolation.yml, grid-reaction.yml, grid-stale-inputs.yml, grid-tariff.yml, defrost-outdoor.yml, dhw-defrost.yml, dhw-protection.yml, dhw-schedule.yml, heat-pump-deploy.yml, heat-pump-er03.yml, heat-pump-idle.yml, heating-curve-follow.yml, heating-curve-monitor.yml, heating-review.yml, heating-warmup.yml, heating-band.yml, heating-kick.yml, heating-defrost.yml, heating-operator-controls.yml, trivial.yml]
    permissions:
      contents: read
    steps:
      - name: Report docs-only skip
        if: needs.build.outputs.relevant == 'false'
        run: echo "No Test GX relevant paths changed; skipping this file." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.build.outputs.relevant == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.build.outputs.relevant == 'true'
        with:
          node-version: 22
      - name: Download shared Test GX images
        if: needs.build.outputs.relevant == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.image-artifact }}
          path: ${{ runner.temp }}
      - name: Load shared Test GX images
        if: needs.build.outputs.relevant == 'true'
        run: |
          docker load --input "$RUNNER_TEMP/test-gx-images.tar.zst"
          docker image inspect mqtt:latest "test-gx-nodered:$TEST_GX_TAG" > /dev/null
      - name: Start Test GX stack
        if: needs.build.outputs.relevant == 'true'
        id: stack
        run: |
          ssh-keygen -q -t ed25519 -N '' -C test-gx -f "$RUNNER_TEMP/test-gx-key"
          cp "$RUNNER_TEMP/test-gx-key.pub" tools/test-gx/test_key.pub
          if ! docker compose -p test-gx -f tools/test-gx/docker-compose.yml -f "$TEST_GX_COMPOSE_OVERRIDE" up -d --no-build; then
            docker compose -p test-gx -f tools/test-gx/docker-compose.yml -f "$TEST_GX_COMPOSE_OVERRIDE" logs --no-color --tail 80 venus
            exit 1
          fi
      - name: Wait for emulator and Node-RED
        if: needs.build.outputs.relevant == 'true'
        run: |
          node <<'NODE'
          const urls = ['http://127.0.0.1:8081/state', 'http://127.0.0.1:1881/flows'];
          const deadline = Date.now() + 300_000;
          (async () => {
            let lastError;
            while (Date.now() < deadline) {
              try {
                for (const url of urls) {
                  const remaining = deadline - Date.now();
                  if (remaining <= 0) throw new Error('Readiness deadline reached');
                  const response = await fetch(url, { signal: AbortSignal.timeout(Math.min(3000, remaining)) });
                  if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
                }
                console.log('Emulator and Node-RED are ready.');
                return;
              } catch (error) {
                lastError = error;
                await new Promise(resolve => setTimeout(resolve, Math.max(0, Math.min(2000, deadline - Date.now()))));
              }
            }
            throw new Error(`Test GX was not ready within 5 minutes: ${lastError?.message}`);
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Run all scenarios
        if: needs.build.outputs.relevant == 'true'
        env:
          FILES: ${{ matrix.files }}
        run: node tools/test-gx/run-scenarios.js --file "$FILES" --junit test-gx-artifacts/junit.xml
      - name: Summarize JUnit results
        if: always() && needs.build.outputs.relevant == 'true'
        env:
          FILES: ${{ matrix.files }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path('test-gx-artifacts/junit.xml')
          if not report.is_file():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write('## Test GX scenarios\n\nJUnit report was not produced.\n')
              raise SystemExit('JUnit report was not produced')
          suite = ET.parse(report).getroot()
          tests = int(suite.attrib['tests'])
          failures = int(suite.attrib['failures'])
          expected_failures = int(suite.attrib['skipped'])
          lines = [
              '## Test GX scenarios: ' + os.environ.get('FILES', ''),
              '',
              f'Scenarios: {tests - failures - expected_failures} passed, '
              f'{failures} failed, {expected_failures} expected_fail',
              '',
          ]
          for case in suite.findall('testcase'):
              failure, skipped = case.find('failure'), case.find('skipped')
              status = 'FAIL' if failure is not None else 'EXPECTED_FAIL' if skipped is not None else 'PASS'
              detail = failure.get('message', '') if failure is not None else ''
              if 'unexpected pass for expected_fail scenario' in detail:
                  detail += ' - fixed? remove marker'
              minutes = float(case.get('time', '0')) / 60  # T1: real minutes per scenario, to find the slow ones
              lines.append(f"- **{status}** ({minutes:.1f} min) {case.get('name')}" + (f': {detail}' if detail else ''))
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(text)
          if failures:
              raise SystemExit(1)
          PY
      - name: Collect Test GX diagnostics
        if: always() && (steps.stack.outcome == 'success' || steps.stack.outcome == 'failure')
        run: |
          mkdir -p test-gx-artifacts
          failed=0
          if ! docker compose -p test-gx -f tools/test-gx/docker-compose.yml -f "$TEST_GX_COMPOSE_OVERRIDE" logs --no-color \
              > test-gx-artifacts/compose.log 2>&1; then
            echo "::warning::Could not collect Compose logs."
            failed=1
          fi
          if ! docker compose -p test-gx -f tools/test-gx/docker-compose.yml -f "$TEST_GX_COMPOSE_OVERRIDE" logs --no-color nodered \
              > test-gx-artifacts/nodered.log 2>&1; then
            echo "::warning::Could not collect Node-RED logs."
            failed=1
          fi
          if ! curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:8081/writes > test-gx-artifacts/writes.json; then
            echo "::warning::Could not collect the emulator /writes dump."
            rm -f test-gx-artifacts/writes.json
            failed=1
          fi
          exit "$failed"
      - name: Upload Test GX diagnostics
        if: always() && (steps.stack.outcome == 'success' || steps.stack.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-gx-logs-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: test-gx-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Tear down Test GX stack
        if: always() && (steps.stack.outcome == 'success' || steps.stack.outcome == 'failure')
        run: docker compose -p test-gx -f tools/test-gx/docker-compose.yml -f "$TEST_GX_COMPOSE_OVERRIDE" down -v

  scenarios:
    if: always()
    needs: [build, run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Report tested versions
        run: |
          version="$(node tools/flows.js version)"
          printf '## Test GX\n\nRepository version: **%s**\n' "$version" >> "$GITHUB_STEP_SUMMARY"
      - name: All scenario files passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RESULT: ${{ needs.run.result }}
        run: |
          echo "scenario jobs: $RESULT"
          [[ "$BUILD_RESULT" == success ]] || { echo "::error::Test GX image job: $BUILD_RESULT"; exit 1; }
          [[ "$RESULT" == success ]] || { echo "::error::Test GX scenario jobs: $RESULT"; exit 1; }
