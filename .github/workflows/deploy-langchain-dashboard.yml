name: Deploy langchain dashboard

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/dev-loop/victron_loop/web.py"
      - "tools/dev-loop/victron_loop/control.py"
      - "tools/dev-loop/systemd/victron-loop-web.service"
      - ".github/workflows/deploy-langchain-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dev-loop-deploy

jobs:
  deploy:
    runs-on: [self-hosted, omarchy]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dev loop and refresh dashboard unit
        run: bash tools/dev-loop/install.sh
      - name: Restart enabled dashboard and smoke test
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          if ! systemctl --user is-enabled --quiet victron-loop-web.service; then
            echo "Dashboard is disabled; leaving it disabled."
            exit 0
          fi
          systemctl --user restart victron-loop-web.service
          cd "$HOME/victron-loop"
          bind="$(./venv/bin/python -c 'import tomllib; print(tomllib.load(open("config.toml", "rb")).get("web_bind", "127.0.0.1:8790"))')"
          for attempt in {1..10}; do
            if status="$(curl -fsS --noproxy '*' --max-time 5 -H "Host: $bind" "http://$bind/api/status")"; then
              printf '%s\n' "$status" | ./venv/bin/python -c 'import json, sys; data = json.load(sys.stdin); print(json.dumps({key: data[key] for key in ("paused", "phase")}))'
              exit 0
            fi
            if [[ "$attempt" != 10 ]]; then sleep 3; fi
          done
          echo "Dashboard did not answer the status probe." >&2
          exit 1
