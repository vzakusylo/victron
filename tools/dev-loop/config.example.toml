repo = "vzakusylo/victron"
branch = "master"
loop_home = "~/victron-loop"
repo_path = "~/victron-loop/repo"
max_worker_runs_per_day = 3
dry_run = true
notify_backend = "notify-send"
token_file = "~/victron-loop/token"
# Do not use the machine's gh login if the scoped token is missing or empty.
allow_gh_login_fallback = false
# Defaults to Copilot on PATH, then ~/.local/bin/copilot.
# npm installations also need node on the service PATH (use a systemd user unit drop-in if needed).
# copilot_bin = "~/.local/bin/copilot"
model_tiers_file = "~/victron-loop/repo/tools/herdr/models.json"
picker_backend = "copilot"
# claude_bin = "~/.local/bin/claude"
# picker_model = "claude-opus-5-5"
picker_effort = "low"
# picker_fallback = "copilot"  # Opt in to fallback on Claude authentication failure.
# Defaults to loopback. Set to your Omarchy Tailscale IPv4 and port for tailnet access.
# web_bind = "127.0.0.1:8790"
# Bare MagicDNS names accepted in addition to the bound IP. Defaults to ["omarchy"].
# web_hosts = ["omarchy", "omarchy.example-tailnet.ts.net"]
# web_token_file = "~/.config/victron-loop/web-token"
# Foreground scheduler interval (minutes); the Linux systemd timer is independent.
# interval_minutes = 10
# worker_backend = "headless"  # Windows defaults to "herdr".
# instance_name = "omarchy"    # Windows defaults to "windows".
# peer_status_url = "http://other-loop:8790/api/peer-status"

