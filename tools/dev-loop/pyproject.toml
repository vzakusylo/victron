[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "victron-loop"
version = "0.1.0"
description = "Victron autonomous dev loop"
requires-python = ">=3.12"
dependencies = [
  "langgraph==0.6.7",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["victron_loop*"]

