- name: charging adaptive support can discharge outside restoration
  faketime: '@2026-11-16 13:00:00'
  controller: {"protection":{"gridSupportW":500,"gridSupportMode":"adaptive-day"}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint"}]
  initial: {"inputs":{"batt_v":53,"consumed_ah":-100,"grid_w":1000,"load_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":500}],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":500}]}

- name: charging rejects stale future previous-day and NaN forecast metadata
  faketime: '@2026-11-16 22:00:00'
  controller: {"protection":{},"forecastWatts":500}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":53,"consumed_ah":-150.1,"grid_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}
    - when: 20s
      controller: {"refreshForecast":true}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0}]}
    - when: 40s
      controller: {"forecastFault":"stale"}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}
    - when: 60s
      controller: {"forecastFault":"future"}
      settle: 20s
      expect: {"if_changed":false,"writes":[]}
    - when: 80s
      controller: {"forecastFault":"previous-day"}
      settle: 20s
      expect: {"if_changed":false,"writes":[]}
    - when: 100s
      controller: {"forecastFault":"nan"}
      settle: 20s
      expect: {"if_changed":false,"writes":[]}

