- name: charging invalid protection file falls back to safe defaults
  faketime: '@2026-11-16 13:00:00'
  controller: {"protection":{}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":50,"consumed_ah":-40,"grid_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0}]}
    - when: 20s
      controller: {"protection":{"forceChargeEnabled":true,"forceChargeGridW":1000}}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":20}]}
    - when: 40s
      controller: {"protection":{"forceChargeEnabled":true,"forceChargeGridW":1000,"start":55.4,"full":55.2}}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0}]}
