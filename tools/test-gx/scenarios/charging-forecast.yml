- name: charging morning solar hold has an HTTP positive control
  faketime: '@2026-11-16 08:00:00'
  controller: {"protection":{},"forecastWatts":500}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":54,"consumed_ah":-100,"grid_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}
    - when: 20s
      controller: {"refreshForecast":true}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0}]}

