- name: Silent and Smart do not hunt around the curve point
  # At x60 the second mode decision can occur before the runner changes the inputs.
  faketime: '@2026-11-16 20:00:00 x30'
  settings: {"master":true,"modes":{"dhw":"off","heat":"live","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heat":{"bandDown":1.5,"bandUp":1,"stepMin":10,"kickMin":0},"heatCurve":{"p23":38,"p24":4},"dhw":{"supplyReady":5}}
  initial:
    inputs:
      tuya.pump.dps.1: true
      tuya.pump.dps.2: mute
      tuya.pump.dps.101: 29
      tuya.pump.dps.102: 34
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 47
      tuya.pump.dps.115: 69
      tuya.pump.dps.116: 596
      tuya.pump.dps.125: 36
      tuya.pump.dps.132: "1"
      tuya.pump.dps.133: 38
      tuya.pump.dps.134: 4
  steps:
    - when: 20m
      settle: 360s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "2"
            value: smart
            applied: true
    - when: 27m
      inputs:
        tuya.pump.dps.101: 31
        tuya.pump.dps.102: 36.4
      settle: 600s
      expect:
        writes: []

- name: Old lagUp and overC settings win over a saved heating band
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"off","heat":"live","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heat":{"band":true,"bandDown":0,"bandUp":2,"lagUp":1.5,"overC":1,"kickMin":0},"heatCurve":{"p23":38,"p24":4},"dhw":{"supplyReady":5}}
  initial:
    inputs:
      tuya.pump.dps.1: true
      tuya.pump.dps.2: mute
      tuya.pump.dps.101: 31
      tuya.pump.dps.102: 36
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 47
      tuya.pump.dps.115: 69
      tuya.pump.dps.116: 596
      tuya.pump.dps.121: 5
      tuya.pump.dps.125: 36
      tuya.pump.dps.132: "1"
      tuya.pump.dps.133: 38
      tuya.pump.dps.134: 4
  steps:
    - when: 10m
      settle: 1200s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "134"
            value: 5
            applied: true
          - device: pump
            operation: SET
            dps: "133"
            value: 40
            applied: true
          - device: pump
            operation: SET
            dps: "121"
            value: 3
            applied: true

- name: DHW after a defrost starts about 15 min after it when the tank deficit is at least 1 degree
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"live","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heatCurve":{"p23":38,"p24":4},"dhw":{"startAfterDefrost":true,"afterDefrost":false,"minIntervalH":0}}
  initial:
    inputs:
      tuya.pump.dps.1: true
      tuya.pump.dps.2: mute
      tuya.pump.dps.101: 31
      tuya.pump.dps.102: 36
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 46.5
      tuya.pump.dps.115: 69
      tuya.pump.dps.116: 596
      tuya.pump.dps.125: 36
      tuya.pump.dps.132: "1"
      tuya.pump.dps.133: 38
      tuya.pump.dps.134: 4
  steps:
    - when: 17m
      inputs:
        tuya.pump.dps.116: 0
      settle: 120s
      expect:
        writes: []
    - when: 20m
      inputs:
        tuya.pump.dps.116: 596
      settle: 600s
      expect:
        writes: []
    - when: 35m
      settle: 600s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "133"
            value: 0
            applied: true
          - device: valve
            operation: SET
            dps: "1"
            value: true
            applied: true
          - device: pump
            operation: SET
            dps: "134"
            value: 12
            applied: true
          - device: pump
            operation: SET
            dps: "133"
            value: 25
            applied: true

