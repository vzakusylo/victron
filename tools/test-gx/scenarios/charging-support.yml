- name: charging disabled HV protection does not taper
  faketime: '@2026-11-16 08:00:00'
  controller: {"protection":{"enabled":false}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":55.4,"consumed_ah":-40,"grid_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}

- name: charging day high load reduces scheduled current proportionally
  expected_fail: CHG-1
  faketime: '@2026-11-16 08:00:00'
  controller: {"protection":{}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":53,"consumed_ah":-40,"grid_w":1000,"load_w":4500}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":24.5}]}

- name: charging manual discharge overrides force mode and stops at low voltage
  faketime: '@2026-11-16 13:00:00'
  controller: {"protection":{"forceChargeEnabled":true,"forceChargeGridW":1000}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint"}]
  initial: {"inputs":{"batt_v":55,"consumed_ah":-40,"grid_w":1000,"load_w":2000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":18},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":3000}]}
    - when: 20s
      controller: {"command":{"topic":"manual-discharge","payload":true}}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":900}]}
    - when: 40s
      inputs: {"load_w":3500}
      settle: 30s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":18},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":4500}]}
    - when: 70s
      inputs: {"load_w":2000}
      settle: 30s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":900}]}
    - when: 100s
      inputs: {"batt_v":53.9}
      settle: 35s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":19},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":3000}]}

- name: charging export guard raises and releases the DVCC limit
  faketime: '@2026-11-16 13:00:00'
  controller: {"protection":{"exportGuardEnabled":true}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":54,"consumed_ah":-40,"grid_w":1000,"pv_w":2000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0}]}
    - when: 20s
      inputs: {"grid_w":-200}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}
    - when: 40s
      inputs: {"grid_w":1000}
      settle: 90s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0}]}

- name: charging HV grid support also scales the current
  expected_fail: CHG-1
  faketime: '@2026-11-16 08:00:00'
  controller: {"protection":{"gridSupportW":500,"gridSupportMode":"hv-only"}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":55.4,"consumed_ah":-40,"grid_w":1000,"load_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":2.5}]}
    - when: 20s
      inputs: {"batt_v":55.1}
      settle: 20s
      expect: {"if_changed":false,"writes":[]}
    - when: 40s
      inputs: {"batt_v":55}
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}

- name: charging restoration blocks adaptive discharge support
  faketime: '@2026-11-16 08:00:00'
  controller: {"protection":{"gridSupportW":500,"gridSupportMode":"adaptive-day"}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint"}]
  initial: {"inputs":{"batt_v":53,"consumed_ah":-40,"grid_w":1000,"load_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":4950}]}
