- name: A DHW valve hold resets the not following monitor
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"off","heat":"live","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heat":{"bandDown":1.5,"bandUp":1,"stepMin":10,"kickMin":0,"allowPowerful":false,"maxBoost":0,"offCurveC":1,"offCurveMin":15},"heatCurve":{"p23":38,"p24":4},"dhw":{"supplyReady":5}}
  initial:
    inputs:
      tuya.pump.dps.1: true
      tuya.pump.dps.2: smart
      tuya.pump.dps.101: 28
      tuya.pump.dps.102: 33
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 47
      tuya.pump.dps.115: 69
      tuya.pump.dps.116: 596
      tuya.pump.dps.125: 36
      tuya.pump.dps.132: "1"
      tuya.pump.dps.133: 38
      tuya.pump.dps.134: 4
  steps:
    - when: 27m
      inputs:
        tuya.valve.dps.1: true
      settle: 1m
      expect:
        writes: []
        log:
          - contains: "not following the curve"
            count: 0
    - when: 29m
      inputs:
        tuya.valve.dps.1: false
      settle: 1m
      expect:
        writes: []
    - when: 43m
      settle: 1m
      expect:
        writes: []
        log:
          - contains: "not following the curve"
            count: 0
        view:
          - path: heat.offCurve.warned
            equals: false
          - path: heat.offCurve.today
            equals: 0
