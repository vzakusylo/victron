# Leave margin for real-time setup before the 15-minute quiet period ends.
- name: no heat pump commands during deploy quiet period
  faketime: '@2026-11-16 20:00:00 x8'
  settings: {"master":true,"modes":{"dhw":"live","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heatCurve":{"p23":35,"p24":4}}
  initial:
    inputs:
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 25
      tuya.pump.dps.115: 0
      tuya.pump.dps.116: 0
      tuya.pump.dps.132: "0"
      tuya.pump.dps.133: 0
  steps:
    - when: 0s
      settle: 380s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "132"
            value: "1"
            applied: true
          - device: pump
            operation: SET
            dps: "134"
            value: 4
            applied: true
          - device: pump
            operation: SET
            dps: "133"
            value: 35
            applied: true
    - when: 380s
      inputs:
        tuya.pump.dps.103: -2
        tuya.pump.dps.108: 25
        tuya.pump.dps.115: 0
        tuya.pump.dps.116: 0
      settle: 400s
      expect:
        writes: []

- name: DHW demand starts after deploy quiet period
  faketime: '@2026-11-16 20:00:00 x10'
  settings: {"master":true,"modes":{"dhw":"live","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heatCurve":{"p23":35,"p24":4}}
  initial:
    inputs:
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 25
      tuya.pump.dps.115: 0
      tuya.pump.dps.116: 0
      tuya.pump.dps.132: "0"
      tuya.pump.dps.133: 0
  steps:
    - when: 0s
      settle: 240s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "132"
            value: "1"
            applied: true
          - device: pump
            operation: SET
            dps: "134"
            value: 4
            applied: true
          - device: pump
            operation: SET
            dps: "133"
            value: 35
            applied: true
    # Setup already consumes about 3.5 fake minutes at x10. Observe the first two
    # writes after the 15-minute quiet period, before the 90-second valve travel ends.
    - when: 11m
      inputs:
        tuya.pump.dps.103: -2
        tuya.pump.dps.108: 25
        tuya.pump.dps.115: 0
        tuya.pump.dps.116: 0
      settle: 85s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "133"
            value: 0
            applied: true
          - device: valve
            operation: SET
            dps: "1"
            value: true
            applied: true

- name: DHW waits for the minimum gap after a finished cycle
  faketime: '@2026-11-16 20:00:00 x10'
  settings: {"master":true,"modes":{"dhw":"live","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heatCurve":{"p23":35,"p24":4},"dhwLastDone":1794857400000}
  initial:
    inputs:
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 25
      tuya.pump.dps.115: 0
      tuya.pump.dps.116: 0
      tuya.pump.dps.132: "0"
      tuya.pump.dps.133: 0
  steps:
    - when: 0s
      settle: 240s
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "132"
            value: "1"
            applied: true
          - device: pump
            operation: SET
            dps: "134"
            value: 4
            applied: true
          - device: pump
            operation: SET
            dps: "133"
            value: 35
            applied: true
    - when: 16m
      inputs:
        tuya.pump.dps.103: -2
        tuya.pump.dps.108: 25
        tuya.pump.dps.115: 0
        tuya.pump.dps.116: 0
      settle: 60s
      expect:
        writes: []
