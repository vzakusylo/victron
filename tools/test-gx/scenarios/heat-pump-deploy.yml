- name: no heat pump commands during deploy quiet period
  faketime: '@2026-11-16 20:00:00'
  settings: {"master":true,"modes":{"dhw":"live","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"}}
  initial:
    inputs:
      tuya.pump.dps.108: 25
  steps:
    - when: 0s
      settle: 75s
      expect:
        writes: []

- name: Er03 positive control after deploy quiet period
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"off","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"live"}}
  steps:
    - when: 16m
      inputs:
        tuya.valve.dps.1: true
        tuya.pump.dps.15: 1
      settle: 75s
      expect:
        writes:
          - device: valve
            operation: SET
            dps: "1"
            value: false
            applied: true

- name: Er03 offline pump guard
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"off","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"live"}}
  initial:
    fail:
      tuya.pump: offline
  steps:
    - when: 16m
      inputs:
        tuya.valve.dps.1: true
        tuya.pump.dps.15: 1
      settle: 75s
      expect:
        writes: []

- name: Er03 stale valve guard
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"off","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"live"}}
  initial:
    inputs:
      tuya.valve.dps.1: true
    stale:
      tuya.valve: 300
  steps:
    - when: 16m
      inputs:
        tuya.pump.dps.15: 1
      settle: 75s
      expect:
        writes: []

- name: Er03 invalid valve guard
  faketime: '@2026-11-16 20:00:00 x60'
  settings: {"master":true,"modes":{"dhw":"off","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"live"}}
  initial:
    inputs:
      tuya.valve.dps.1: true
    fail:
      tuya.valve: invalid
  steps:
    - when: 16m
      inputs:
        tuya.pump.dps.15: 1
      settle: 75s
      expect:
        writes: []
