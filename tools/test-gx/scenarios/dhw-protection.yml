name: DHW keeps Silent and caps supply at the cold limit, then steps down on frequency or current
faketime: '@2026-11-16 20:00:00 x12'
settings: {"master":true,"modes":{"dhw":"live","heat":"off","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heatCurve":{"p23":35,"p24":4},"dhw":{"coldLimit":-10,"coldCap":42,"gapRamp":false}}
initial:
  inputs: {"tuya.pump.dps.2":"smart","tuya.pump.dps.101":38,"tuya.pump.dps.102":40,"tuya.pump.dps.103":-10,"tuya.pump.dps.104":60,"tuya.pump.dps.108":25,"tuya.pump.dps.112":0,"tuya.pump.dps.115":0,"tuya.pump.dps.116":600,"tuya.pump.dps.132":"1","tuya.pump.dps.133":35,"tuya.pump.dps.134":4}
steps:
  - when: 14m
    fromDeploy: true
    settle: 0s
    expect:
      writes: []
  - when: 15m
    fromDeploy: true
    settle: 3m
    expect:
      writes: [{"device":"pump","dps":"2","value":"mute"},{"device":"pump","dps":"133","value":0},{"device":"valve","dps":"1","value":true},{"device":"pump","dps":"134","value":12},{"device":"pump","dps":"133","value":9}]
      view: [{"path":"state","equals":"DHW"},{"path":"cold","equals":true},{"path":"wanted","equals":42},{"path":"p23Cmd","equals":9}]
  - when: 1110s
    fromDeploy: true
    settle: 210s
    inputs: {"tuya.pump.dps.115":81}
    expect:
      writes: [{"device":"pump","dps":"133","value":6}]
      view: [{"path":"prot.steps","equals":1},{"path":"prot.reason","contains":"81 Hz"}]
  - when: 1350s
    fromDeploy: true
    settle: 45s
    inputs: {"tuya.pump.dps.115":50}
    expect:
      writes: []
      view: [{"path":"prot.hotSince","equals":0}]
  - when: 1410s
    fromDeploy: true
    settle: 210s
    inputs: {"tuya.pump.dps.112":9}
    expect:
      writes: [{"device":"pump","dps":"133","value":4}]
      view: [{"path":"prot.steps","equals":2},{"path":"prot.reason","contains":"9 A"}]
