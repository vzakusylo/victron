- name: Lagging supply steps Silent -> Smart -> Powerful when Powerful is allowed
  faketime: '@2026-11-16 20:00:00 x3'
  settings: {"master":true,"modes":{"dhw":"off","heat":"live","df_exchange_off":"off","df_exchange_on":"off","hp_er03_restart":"off"},"heat":{"bandDown":1.5,"bandUp":1,"stepMin":10,"kickMin":0,"allowPowerful":true},"heatCurve":{"p23":38,"p24":4},"dhw":{"supplyReady":5}}
  initial:
    inputs:
      tuya.pump.dps.1: true
      tuya.pump.dps.2: mute
      tuya.pump.dps.101: 28
      tuya.pump.dps.102: 33
      tuya.pump.dps.103: -2
      tuya.pump.dps.108: 47
      tuya.pump.dps.115: 69
      tuya.pump.dps.116: 596
      tuya.pump.dps.125: 36
      tuya.pump.dps.132: "1"
      tuya.pump.dps.133: 38
      tuya.pump.dps.134: 4
  steps:
    - when: 20m
      settle: 8m
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "2"
            value: smart
            applied: true
    - when: 30m
      settle: 8m
      expect:
        writes:
          - device: pump
            operation: SET
            dps: "2"
            value: strong
            applied: true

