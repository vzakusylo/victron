- name: charging night deficit exceeds morning capacity
  faketime: '@2026-11-16 23:00:00'
  controller: {"protection":{}}
  observe: [{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent"}]
  initial: {"inputs":{"batt_v":53,"consumed_ah":-160,"grid_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25}]}

