      settle: 40s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":18},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":4500}]}
    - when: 100s
      inputs: {"load_w":2000}
      settle: 40s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":0},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":900}]}
    - when: 160s
