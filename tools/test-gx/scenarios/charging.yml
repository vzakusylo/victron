  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":true,"writes":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":18},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":3000}]}
    - when: 20s
