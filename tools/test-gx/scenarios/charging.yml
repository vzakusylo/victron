  initial: {"inputs":{"batt_v":53,"consumed_ah":-40,"grid_w":1000}}
  steps:
    - when: 0s
      settle: 20s
      expect: {"if_changed":false,"writes":[],"outputs":[{"service":"settings","path":"/Settings/SystemSetup/MaxChargeCurrent","value":25},{"service":"settings","path":"/Settings/CGwacs/AcPowerSetPoint","value":1950},{"service":"vebus","path":"/Ac/In/1/CurrentLimit","value":9.5}]}

