# Test GX: Venus D-Bus simulator + Node-RED. See docs/test-gx.md.
# Fake data only. Never put real secrets or the real GX key here.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "test-gx/health", "-m", "ready", "-q", "1"]
      interval: 3s
      timeout: 5s
      retries: 20
  venus:
    image: mqtt            # built by up.ps1 from victronenergy/venus-docker
    command: ["bash", "/emulator/start.sh", "${TEST_GX_SIM:-e}"]   # "emu" = our emulator, a letter = venus-docker simulation
    environment:
      EMU_READY_DELAY: ${EMU_READY_DELAY:-0}   # test hook, see test-emulator-ready.ps1
    depends_on:
      mosquitto: { condition: service_healthy }
    volumes:
      - ./emulator:/emulator:ro
    healthcheck:   # Node-RED starts only when the D-Bus services exist, otherwise the palette finds none
      test: ["CMD", "bash", "/emulator/healthcheck.sh", "${TEST_GX_SIM:-e}"]
      interval: 3s
      start_period: 30s
      retries: 60
    ports:
      - "127.0.0.1:8081:8081"   # emulator HTTP API (-Sim emu)
      - "127.0.0.1:3000:3000"   # D-Bus over TCP
      - "127.0.0.1:8080:80"     # Venus HTML5 app
  nodered:
    build:
      context: .
      additional_contexts:
        backup: ${TEST_GX_BACKUP:-./backup-required-use-fixture-override}
      args:
        NODERED_VERSION: ${TEST_GX_NODERED_VERSION:-3.1.15}
        PALETTE: ${TEST_GX_PALETTE:-}
    image: test-gx-nodered:${TEST_GX_TAG:-local}
    # Direct Compose must select a backup or the isolated fixture override.
    env_file:
      - "${TEST_GX_BACKUP:+./fixture/}SET_TEST_GX_BACKUP_OR_USE_FIXTURE_OVERRIDE.env"
    depends_on:
      venus: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    environment:
      NODE_RED_DBUS_ADDRESS: venus:3000
      DBUS_SYSTEM_BUS_ADDRESS: tcp:host=venus,port=3000   # python dbus in the exec nodes (Devices page)
      TZ: Europe/Oslo
      TEST_GX_FAKETIME: ${TEST_GX_FAKETIME:-}
    ports:
      - "127.0.0.1:1881:1880"   # Node-RED (1881: avoids clash with a local one)
      - "127.0.0.1:2222:22"     # SSH as root, test key only
    volumes:
      - gx-data:/data
      - ./test_key.pub:/tmp/test_key.pub:ro
volumes:
  gx-data:
